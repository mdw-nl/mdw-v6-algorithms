[project]
name = "descriptive_statistics"
version = "0.1.0"
description = "Federated descriptive statistics: counts, minmax, mean, std over arbitrary columns"
requires-python = ">=3.13,<3.14"
dependencies = [
    "v6core",
    "vantage6-algorithm-tools==4.14.0",
    "pandas>=2.2.0,<3",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "pydantic>=2.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["descriptive_statistics"]

[tool.uv.sources]
v6core = { workspace = true }
