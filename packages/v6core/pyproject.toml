[project]
name = "v6core"
version = "0.1.0"
description = "Shared building blocks for MDW's standard vantage6 algorithms"
requires-python = ">=3.13,<3.14"
dependencies = [
    "pandas>=2.2.0,<3",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "pydantic>=2.6.0",
    "pyjwt>=2.8.0",
    "vantage6-algorithm-tools==4.14.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["v6core"]
