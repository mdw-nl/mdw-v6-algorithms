[project]
name = "v6run"
version = "0.1.0"
description = "Researcher-facing CLI and Python API for running studies against this repo's algorithms (AGENTS.md §9.4)"
requires-python = ">=3.13,<3.14"
dependencies = [
    "v6core",
    "vantage6-client==4.14.0",
    "pydantic>=2.6.0",
    "pyyaml>=6.0",
]

[project.scripts]
v6run = "v6run.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["v6run"]

[tool.uv.sources]
v6core = { workspace = true }
